name: Downloads Report

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC (IST has no DST, UTC+5:30 year-round)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate downloads report
        run: node scripts/npm-downloads-report.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOWNLOADS.md reports/downloads
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update downloads report"
            git push
          fi
